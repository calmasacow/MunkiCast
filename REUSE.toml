version = 1
SPDX-PackageName = "MunkiCast"
SPDX-PackageSupplier = "MunkiCast contributors"
SPDX-PackageDownloadLocation = "https://github.com/calmasacow/MunkiCast"

[[annotations]]
path = ["tests/unit/fixtures/images/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "MunkiCast contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["**/*.json", "**/*.toml", "**/*.md", ".gitignore", ".clang-format", ".editorconfig"]
precedence = "aggregate"
SPDX-FileCopyrightText = "MunkiCast contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["third_party/vulkan-headers/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2015-2026 The Khronos Group Inc."
SPDX-License-Identifier = "Apache-2.0 OR MIT"
